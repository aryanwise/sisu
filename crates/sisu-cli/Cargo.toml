[package]
name = "sisu-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[[bin]]
name = "sisu"
path = "src/main.rs"

[dependencies]
sisu-core = { path = "../sisu-core" }
clap = { version = "4", features = ["derive"] }
reedline = "0.43"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
